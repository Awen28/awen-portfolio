<!doctype html>
<html lang="de-AT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <title>Studio Elior</title>
    <meta name="title" content="Studio Elior" />
    <meta name="description" content="Elior – Digital Studio aus Tirol. Weiter zu elior.studio." />
    <meta name="author" content="Thomas Mayrl" />
    <meta name="robots" content="noindex, follow" />

    <link rel="canonical" href="https://www.elior.studio/" />
    <link rel="alternate" hreflang="x-default" href="https://www.elior.studio/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.elior.studio/" />
    <meta property="og:title" content="Studio Elior" />
    <meta property="og:description" content="Digital Studio aus Tirol. Weiter zu elior.studio." />
    <meta property="og:image" content="https://www.elior.studio/og-image.jpg" />
    <meta property="og:site_name" content="Elior" />

    <meta name="theme-color" content="#BBB1A4" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/webp" href="/logos/elior-star.webp" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logos/elior-star.webp" />
    <link rel="icon" type="image/svg+xml" href="/logos/elior-symbol.svg" />
    <link rel="mask-icon" href="/logos/elior-symbol.svg" color="#9A7A50" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.elior.studio" />

    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="hero">
      <div class="hero__glow" aria-hidden="true"></div>

      <div class="stage">
        <img
          class="symbol"
          src="/logos/elior-symbol.svg"
          alt="ELIOR"
          width="80"
          height="80"
        />

        <h1 id="elior" class="wordmark">ELIOR</h1>

        <span class="hebrew">
          <span class="hebrew__inner">אליאור</span>
        </span>

        <span class="tagline">Mit Bedeutung gebaut.</span>

        <a
          class="enter"
          href="https://www.elior.studio"
          aria-label="Weiter zu www.elior.studio"
        >
          <span class="enter__label">www.elior.studio</span>
          <svg
            class="enter__arrow"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 12h14" />
            <path d="M13 6l6 6-6 6" />
          </svg>
        </a>
      </div>
    </main>

    <script src="/script.js" defer></script>
  </body>
</html>
